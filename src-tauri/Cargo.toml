[package]
name = "tuxnotes"
description = "TuxNotes - open notes for Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "tuxnotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tuxnotes-core = { path = "../crates/tuxnotes-core" }
tuxnotes-gdrive = { path = "../crates/tuxnotes-gdrive" }
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
keyring = { version = "3", features = ["async-secret-service", "tokio", "crypto-rust"] }
reqwest.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
log = "0.4"
env_logger = "0.11"
