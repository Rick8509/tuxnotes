[workspace]
members = ["crates/tuxnotes-core", "crates/tuxnotes-gdrive", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Rick8509/tuxnotes"
rust-version = "1.90"

[workspace.dependencies]
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sha2 = "0.11"
reqwest = { version = "0.13", features = ["json", "form", "query"] }
tokio = { version = "1", features = ["net", "io-util", "time", "macros", "sync"] }
url = "2"
base64 = "0.23"
getrandom = "0.4"
argon2 = "0.6"
chacha20poly1305 = "0.11"
zeroize = "1"
wiremock = "0.6"

# Password hashing is deliberately expensive and encryption runs over whole backups;
# unoptimized they take many seconds, so keep them fast in debug builds and tests too.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
