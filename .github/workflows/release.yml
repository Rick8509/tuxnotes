name: Release

# Push a tag like v0.1.0 to build Linux packages and attach them to a draft GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Build on the oldest supported Ubuntu so the AppImage/deb run on more distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the tag matches the app version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the app version $version (package.json)"
            exit 1
          fi
          cargo test -p tuxnotes cargo_and_package_json_versions_match
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Built-in Google OAuth client for Drive backup (see docs/google-setup.md).
          # Uncomment once the repository secrets exist:
          # TUXNOTES_GOOGLE_CLIENT_ID: ${{ secrets.TUXNOTES_GOOGLE_CLIENT_ID }}
          # TUXNOTES_GOOGLE_CLIENT_SECRET: ${{ secrets.TUXNOTES_GOOGLE_CLIENT_SECRET }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "TuxNotes ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md for what's new."
          releaseDraft: true
          prerelease: false
